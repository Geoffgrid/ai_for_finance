name: Fetch BTC data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install
        run: pip install yfinance pandas

      - name: Fetch
        run: python scripts/fetch_btc.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data_folder/
          git diff --staged --quiet || git commit -m "chore: update BTC data $(date +%Y-%m-%d)"
          git push
